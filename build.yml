name: Build Chromium Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Указываем обе архитектуры
        abi: [arm64-v8a, armeabi-v7a]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile Library
        run: |
          mkdir build_${{ matrix.abi }} && cd build_${{ matrix.abi }}
          
          # Настройка для конкретной ABI
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
            
          make -j$(nproc)
          
          # Гарантируем, что файл называется именно так, как нам нужно
          if [ -f "libhtml_chromium.so" ]; then
            mv libhtml_chromium.so html_chromium.so
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.abi }}
          path: build_${{ matrix.abi }}/html_chromium.so
