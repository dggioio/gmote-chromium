      - name: Compile 32-bit Library
        run: |
          mkdir build_32 && cd build_32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          # ИЩЕМ И КОПИРУЕМ БЕЗ ПРЕФИКСА 'lib'
          # Если файл называется html_chromium.so, мы его скопируем
          if [ -f "html_chromium.so" ]; then
            cp html_chromium.so ../html_chromium_32.so
          elif [ -f "libhtml_chromium.so" ]; then
            cp libhtml_chromium.so ../html_chromium_32.so
          else
            echo "Файл не найден!" && exit 1
          fi

