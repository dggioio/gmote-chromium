name: Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NDK r10e
        run: |
          wget -q https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin
          chmod +x android-ndk-r10e-linux-x86_64.bin
          ./android-ndk-r10e-linux-x86_64.bin -y > /dev/null
          echo "NDK_ROOT=$PWD/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Libraries
        run: |
          # Включаем вывод всех команд для отладки
          set -x 
          
          sed -i "s|/data/data/com.termux/files/usr/opt/android-ndk|$PWD/android-ndk-r10e|g" build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/make|make|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/cmake|cmake|g' build.sh
          chmod +x build.sh
          
          # Запуск сборки с полным логом
          echo "STARTING ARM V7A BUILD"
          APP_ABI=armeabi-v7a ./build.sh 2>&1
          
          echo "STARTING ARM64 V8A BUILD"
          APP_ABI=arm64-v8a ./build.sh 2>&1

      - name: Debug Output
        run: |
          echo "--- ПОЛНЫЙ СПИСОК ФАЙЛОВ В РЕПОЗИТОРИИ ---"
          find . -type f
          echo "--- ПОЛНЫЙ СПИСОК ВСЕХ .SO ФАЙЛОВ ---"
          find . -name "*.so"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-found-libs
          path: |
            **/html_chromium.so
            **/*.so
