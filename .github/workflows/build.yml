name: Force Build 32-bit r25c

on: [push, pull_request]

jobs:
  build_32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r25c Manually
        run: |
          # Скачиваем официальный NDK r25c
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME/ndk_r25c
          
          # Жестко прописываем путь
          echo "ANDROID_NDK_HOME=$HOME/ndk_r25c/android-ndk-r25c" >> $GITHUB_ENV
          echo "NDK_PATH=$HOME/ndk_r25c/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build with Forced NDK
        run: |
          # Используем именно тот путь, который мы только что прописали
          export ANDROID_NDK_HOME=$HOME/ndk_r25c/android-ndk-r25c
          
          mkdir build_32 && cd build_32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib_armeabi-v7a
          path: build_32/html_chromium.so
