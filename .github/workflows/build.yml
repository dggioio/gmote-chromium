name: Build libhtml_chromium

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ARM32 (armeabi-v7a)
        run: |
          mkdir -p build_arm32
          cd build_arm32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel

      - name: Build ARM64 (arm64-v8a)
        run: |
          mkdir -p build_arm64
          cd build_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp build_arm32/libhtml_chromium.so output/libhtml_chromium_32.so
          cp build_arm64/libhtml_chromium.so output/libhtml_chromium_64.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libhtml_chromium
          path: output/
