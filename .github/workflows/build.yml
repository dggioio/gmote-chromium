name: Build Source Engine (32 & 64 bit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Добавляет кнопку "Run workflow" на сайте GitHub

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download and Setup NDK r21e
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
          echo "NDK_ROOT=/opt/android-ndk-r21e" >> $GITHUB_ENV

      - name: Fix Hardcoded Paths (Symlink Hack)
        run: |
          # Создаем структуру, которую жестко ищет старый Source Engine
          sudo mkdir -p /home/nillerusr
          # Перенаправляем запрос старого NDK r10e на скачанный современный r21e
          sudo ln -s /opt/android-ndk-r21e /home/nillerusr/android-ndk-r10e

      - name: Make build.sh Executable
        run: chmod +x build.sh

      - name: Compile Libraries
        run: ./build.sh

      - name: Upload Ready .so Files
        uses: actions/upload-artifact@v3
        with:
          name: SourceEngine-Libraries
          # Ищем готовые файлы по всем стандартным путям вывода
          path: |
            **/lib/android/armeabi-v7a/*.so
            **/lib/android/arm64-v8a/*.so
            **/libs/armeabi-v7a/*.so
            **/libs/arm64-v8a/*.so
            **/obj/local/armeabi-v7a/*.so
            **/obj/local/arm64-v8a/*.so
