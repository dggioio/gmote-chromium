name: Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip -d /opt/
          echo "NDK_ROOT=/opt/android-ndk-r21e" >> $GITHUB_ENV
      - run: |
          sudo mkdir -p /home/nillerusr
          sudo ln -s /opt/android-ndk-r21e /home/nillerusr/android-ndk-r10e
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake make
      - run: |
          sed -i 's|/data/data/com.termux/files/usr/opt/android-ndk|/opt/android-ndk-r21e|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/make|make|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/cmake|cmake|g' build.sh
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lib-files
          path: |
            **/armeabi-v7a/*.so
            **/arm64-v8a/*.so
