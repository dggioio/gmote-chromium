name: Build Chromium (Force r25c)

on: [push, pull_request]

jobs:
  build_32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip -d $HOME/android-ndk-r25c
          echo "CUSTOM_NDK=$HOME/android-ndk-r25c/android-ndk-r25c" >> $GITHUB_ENV

      - name: Compile 32-bit
        run: |
          mkdir build_32 && cd build_32
          # Явно передаем путь к NDK через переменную, которую мы только что создали
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$CUSTOM_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
      - uses: actions/upload-artifact@v4
        with:
          name: lib_armeabi-v7a
          path: build_32/html_chromium.so
