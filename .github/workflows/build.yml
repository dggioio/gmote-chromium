name: Build 32-bit (Hard Force)

on: [push, pull_request]

jobs:
  build_32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force NDK r25c
        run: |
          # 1. Удаляем все старые NDK из образа, чтобы они не мешали
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          
          # 2. Качаем r25c
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          
          # 3. Переопределяем путь для текущей сессии
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Compile 32-bit
        run: |
          # Используем путь, который мы только что экспортировали
          export ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c
          
          mkdir build_32 && cd build_32
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
      - uses: actions/upload-artifact@v4
        with:
          name: lib_armeabi-v7a
          path: build_32/html_chromium.so
