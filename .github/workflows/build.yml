name: Build NDK r10e
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r10e
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
          unzip -q android-ndk-r10e-linux-x86_64.zip
          echo "NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build with ndk-build
        run: |
          $NDK_ROOT/ndk-build -C .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib_chromium_ndk10e
          path: |
            obj/local/armeabi-v7a/libhtml_chromium.so
            obj/local/arm64-v8a/libhtml_chromium.so
