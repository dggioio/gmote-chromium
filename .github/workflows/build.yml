
name: Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NDK r10e
        run: |
          wget -q https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin
          chmod +x android-ndk-r10e-linux-x86_64.bin
          ./android-ndk-r10e-linux-x86_64.bin -y > /dev/null
          echo "NDK_ROOT=$PWD/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Libraries
        run: |
          # Исправление путей
          sed -i "s|/data/data/com.termux/files/usr/opt/android-ndk|$PWD/android-ndk-r10e|g" build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/make|make|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/cmake|cmake|g' build.sh
          chmod +x build.sh
          
          # Сборка 32-бит
          echo "Building 32-bit..."
          APP_ABI=armeabi-v7a ./build.sh
          mkdir -p dist/armeabi-v7a
          find . -name "html_chromium.so" -exec cp {} dist/armeabi-v7a/ \;
          
          # Очистка перед 64-бит
          make clean || true
          
          # Сборка 64-бит
          echo "Building 64-bit..."
          APP_ABI=arm64-v8a ./build.sh
          mkdir -p dist/arm64-v8a
          find . -name "html_chromium.so" -exec cp {} dist/arm64-v8a/ \;

      - name: Debug Output
        run: |
          echo "Файлы для загрузки:"
          find dist -name "*.so"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html_chromium
          path: dist/
