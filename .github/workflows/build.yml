name: Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NDK r10e
        run: |
          wget -q https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin
          chmod +x android-ndk-r10e-linux-x86_64.bin
          ./android-ndk-r10e-linux-x86_64.bin -y > /dev/null
          echo "NDK_ROOT=$PWD/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Libraries
        run: |
          sed -i "s|/data/data/com.termux/files/usr/opt/android-ndk|$PWD/android-ndk-r10e|g" build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/make|make|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/cmake|cmake|g' build.sh
          chmod +x build.sh
          
          # Собираем и сразу перемещаем результат в понятные папки
          mkdir -p output/armeabi-v7a output/arm64-v8a
          
          APP_ABI=armeabi-v7a ./build.sh
          find . -name "html_chromium.so" -exec cp {} output/armeabi-v7a/ \;
          
          # Очистка перед следующей сборкой (если нужно)
          make clean || true
          
          APP_ABI=arm64-v8a ./build.sh
          find . -name "html_chromium.so" -exec cp {} output/arm64-v8a/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html_chromium_libs
          path: output/
