name: Build
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup NDK r10e
        run: |
          wget -q https://dl.google.com/android/ndk/android-ndk-r10e-linux-x86_64.bin
          chmod +x android-ndk-r10e-linux-x86_64.bin
          ./android-ndk-r10e-linux-x86_64.bin -y > /dev/null
          echo "NDK_ROOT=$PWD/android-ndk-r10e" >> $GITHUB_ENV

      - name: Build Libraries
        run: |
          sed -i "s|/data/data/com.termux/files/usr/opt/android-ndk|$PWD/android-ndk-r10e|g" build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/make|make|g' build.sh
          sed -i 's|/data/data/com.termux/files/usr/bin/cmake|cmake|g' build.sh
          chmod +x build.sh
          
          mkdir -p separate_artifacts/armeabi-v7a
          mkdir -p separate_artifacts/arm64-v8a
          
          APP_ABI=armeabi-v7a ./build.sh
          find . -maxdepth 4 -name "html_chromium.so" -not -path "*/android-ndk-r10e/*" -exec cp {} separate_artifacts/armeabi-v7a/ \;
          
          make clean || true
          
          APP_ABI=arm64-v8a ./build.sh
          find . -maxdepth 4 -name "html_chromium.so" -not -path "*/android-ndk-r10e/*" -exec cp {} separate_artifacts/arm64-v8a/ \;

      - name: Verify Results
        run: |
          ls -R separate_artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html_chromium_final
          path: separate_artifacts/
